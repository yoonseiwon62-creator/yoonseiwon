<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<title>가계부</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1d29;--mut:#7b8094;--line:#e7e9f1;--pri:#4f46e5;--pri2:#6366f1;--exp:#ef4444;--inc:#16a34a;--sh:0 2px 12px rgba(20,24,60,.07)}
:root[data-theme=dark]{--bg:#0f1117;--card:#181b25;--tx:#eceef6;--mut:#8b91a8;--line:#272b3a;--pri:#818cf8;--pri2:#6366f1;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 16px 110px}
h1,h2,h3{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.top h1{font-size:20px;font-weight:800}
.mnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 12px}
.mnav button{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-size:20px}
.mnav .mtitle{width:auto;padding:0 18px;font-weight:700;font-size:16px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h3{font-size:15px;margin-bottom:10px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.mut{color:var(--mut)}.up{color:var(--exp)}.down{color:var(--inc)}
.sum3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sum3 div{background:var(--bg);border-radius:12px;padding:10px 12px}
.sum3 small{display:block;color:var(--mut);font-size:12px}.sum3 b{font-size:16px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.bar.warn i{background:#f59e0b}.bar.over i{background:var(--exp)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt small{color:var(--mut);font-size:12px}
.amt{font-weight:700;white-space:nowrap}.amt.expense{color:var(--tx)}.amt.income{color:var(--inc)}
.dayh{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding:12px 4px 2px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.seg2{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin-bottom:10px}
.seg2 button{flex:1;padding:8px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.seg2 button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;color:var(--mut);font-size:12px;padding:4px 0}
.cd{aspect-ratio:1/1.05;border-radius:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 1px;overflow:hidden}
.cd i{font-style:normal;font-size:12px;font-weight:600}.cd em{font-style:normal;font-size:10px;margin-top:2px}
.cd.empty{background:none}.cd.today{outline:2px solid var(--pri)}.cd.sel{outline:2px solid var(--tx)}
.legend .row{padding:9px 4px}.dot{width:12px;height:12px;border-radius:4px;flex:none}
.donutwrap{display:grid;place-items:center}
.seg{cursor:pointer;transition:stroke-width .15s}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:center;z-index:20}
.tabbar .in{max-width:560px;width:100%;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11px;padding:4px 0}
.tb span{font-size:21px;line-height:1}.tb.on{color:var(--pri);font-weight:700}
.fab{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),#8b5cf6);color:#fff;font-size:32px;margin:-26px auto 0;box-shadow:0 6px 18px rgba(79,70,229,.45);display:grid;place-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,25,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);z-index:41}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:18px;margin-bottom:12px}
.sheet label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.big3{display:grid;gap:10px}
.nlbox{display:flex;gap:8px;align-items:center}.nlbox input{flex:1;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical;line-height:1.5;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--line,#ddd);background:var(--card,#fff);color:inherit;margin-top:8px}
#toast{white-space:pre-line}
.bigbtn{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:16px;padding:16px;text-align:left}
.bigbtn span{font-size:30px}.bigbtn b{display:block;font-size:16px}.bigbtn small{color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:13px;border-radius:14px;font-weight:700;background:var(--bg)}
.btn.pri{background:var(--pri);color:#fff;flex:2}.btn.dng{color:var(--exp)}
.btn.sm{flex:none;padding:9px 14px;font-size:13px}
.note{border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px;background:#eef2ff;color:#3730a3}
:root[data-theme=dark] .note{background:#23264a;color:#c7d2fe}
.note.err{background:#fee2e2;color:#991b1b}:root[data-theme=dark] .note.err{background:#4a1f25;color:#fecaca}
.note.warn{background:#fef3c7;color:#92400e}:root[data-theme=dark] .note.warn{background:#4a3a14;color:#fde68a}
.pv{width:100%;max-height:150px;object-fit:contain;border-radius:12px;background:var(--bg);cursor:zoom-in;margin-bottom:6px}
.pv.big{max-height:none;cursor:zoom-out}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cg{padding:8px 2px;border-radius:12px;background:var(--bg);font-size:11px;text-align:center;border:2px solid transparent}
.cg span{display:block;font-size:20px}.cg.on{border-color:var(--pri);background:var(--card)}
.pay{display:flex;gap:6px}.pay button{flex:1;padding:9px 2px;border-radius:10px;background:var(--bg);font-size:13px;border:2px solid transparent}.pay button.on{border-color:var(--pri);background:var(--card);font-weight:700}
.setsec{margin:18px 4px 8px;font-size:13px;color:var(--mut);font-weight:700}
.fld{margin-bottom:10px}.fld label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radio{display:grid;gap:8px}
.rd{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;border-radius:14px;background:var(--bg);border:2px solid transparent;width:100%}
.rd.on{border-color:var(--pri);background:var(--card)}.rd small{color:var(--mut);display:block}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1f2233;color:#fff;padding:11px 16px;border-radius:14px;z-index:80;max-width:88%;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:rgba(10,12,25,.6);z-index:90;display:none;place-items:center;color:#fff;text-align:center}
#busy.show{display:grid}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:20px}
.lockin{width:100%;max-width:320px;text-align:center}
.pins{display:flex;gap:14px;justify-content:center;margin:18px 0 26px}.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.pins i.f{background:var(--pri)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.keys button{height:62px;border-radius:50%;background:var(--card);font-size:22px;font-weight:600;box-shadow:var(--sh)}
.tip{display:flex;gap:10px;align-items:flex-start}.tip button{margin-left:auto;color:var(--mut)}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast"></div>
<div id="busy"><div><div class="spin"></div><div id="busyt">처리 중…</div></div></div>
<input type="file" id="fcam" accept="image/*" capture="environment" hidden>
<input type="file" id="fgal" accept="image/*" multiple hidden>
<input type="file" id="fcsv" accept=".csv,text/csv" hidden>
<input type="file" id="fjson" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
/* ===== 유틸 ===== */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const WD=['일','월','화','수','목','금','토'];
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const nowYm=()=>todayStr().slice(0,7);
const addMonth=(ym,k)=>{let p=ym.split('-').map(Number),y=p[0],m=p[1]+k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad(m);};
const dim=ym=>{const p=ym.split('-').map(Number);return new Date(p[0],p[1],0).getDate();};
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const num=n=>Math.round(n).toLocaleString('ko-KR');
const compact=n=>n>=10000?(Math.round(n/1000)/10).toString().replace(/\.0$/,'')+'만':num(n);
const ymTitle=ym=>{const p=ym.split('-');return p[0]+'년 '+Number(p[1])+'월';};
const dayKo=ds=>{const p=ds.split('-').map(Number);return p[1]+'월 '+p[2]+'일 ('+WD[new Date(p[0],p[1]-1,p[2]).getDay()]+')';};
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===== 카테고리 ===== */
const BASE=[
 {id:'food',name:'식비',emoji:'🍚',color:'#f97316'},
 {id:'cafe',name:'카페·간식',emoji:'☕',color:'#a16207'},
 {id:'transport',name:'교통',emoji:'🚌',color:'#0ea5e9'},
 {id:'shopping',name:'쇼핑',emoji:'🛍️',color:'#ec4899'},
 {id:'fashion',name:'패션·미용',emoji:'👗',color:'#a855f7'},
 {id:'living',name:'생활·마트',emoji:'🧺',color:'#22c55e'},
 {id:'housing',name:'주거·통신',emoji:'🏠',color:'#6366f1'},
 {id:'health',name:'의료·건강',emoji:'💊',color:'#ef4444'},
 {id:'leisure',name:'문화·여가',emoji:'🎬',color:'#14b8a6'},
 {id:'edu',name:'교육·도서',emoji:'📚',color:'#3b82f6'},
 {id:'gift',name:'경조사·선물',emoji:'🎁',color:'#f43f5e'},
 {id:'etc',name:'기타',emoji:'📦',color:'#64748b'}];
const INC=[
 {id:'salary',name:'급여',emoji:'💼',color:'#16a34a'},
 {id:'allow',name:'용돈',emoji:'💌',color:'#65a30d'},
 {id:'inc_etc',name:'기타수입',emoji:'💰',color:'#0d9488'}];
const PAYS=['카드','현금','계좌이체','간편결제'];
const CUSTOM_COLORS=['#d946ef','#0891b2','#ca8a04','#dc2626','#4d7c0f','#7c3aed'];
const KW=[
 ['cafe',/카페|커피|스타벅스|투썸|이디야|메가커피|컴포즈|빽다방|베이커리|빵집|디저트|아이스크림|도넛|배스킨/],
 ['food',/점심|저녁|아침|식사|야식|회식|술집|호프|포차|도시락|식당|치킨|피자|국밥|김밥|분식|한식|중식|일식|고기|버거|맥도날드|롯데리아|배달의민족|배민|요기요|쿠팡이츠|맛집|족발|횟집|뷔페|냉면|칼국수|삼겹|곱창/],
 ['transport',/택시|버스|지하철|교통|주유|에너지|칼텍스|주차|하이패스|KTX|코레일|철도|카카오T|티머니|고속|항공/],
 ['health',/병원|의원|약국|치과|한의원|클리닉|안과|피부과|건강/],
 ['leisure',/영화|CGV|메가박스|롯데시네마|넷플릭스|노래방|PC방|게임|여행|숙박|호텔|펜션|공연|티켓|왓챠|디즈니|유튜브|골프|볼링/],
 ['edu',/학원|서점|교보|영풍|YES24|예스24|알라딘|강의|클래스|인강|도서/],
 ['housing',/통신|KT|SKT|LG유플러스|전기|가스|수도|관리비|월세|인터넷|보험/],
 ['fashion',/의류|유니클로|자라|ZARA|무신사|미용실|헤어|네일|올리브영|화장품|이니스프리|신발|나이키|아디다스|백화점/],
 ['living',/마트|이마트|홈플러스|롯데마트|편의점|GS25|CU|세븐일레븐|이마트24|다이소|생활|하나로/],
 ['shopping',/쿠팡|11번가|G마켓|옥션|네이버쇼핑|SSG|위메프|티몬|아마존|알리|스토어|쇼핑|몰/],
 ['gift',/꽃|경조|축의|부조|선물/]];
function guessCat(text){text=String(text||'');for(const k of KW){if(k[1].test(text))return k[0];}return 'etc';}

/* ===== 데이터 ===== */
const KEY='gagyebu.v1';
const defCfg=()=>({provider:'gemini',geminiKey:'',claudeKey:'',geminiModel:'gemini-3.5-flash',claudeModel:'claude-haiku-5-5',theme:'auto',pinHash:'',budgetTotal:0,budgetCat:{},customCats:[],recurring:[],iosTipHidden:false,learn:{},recIgnore:[]});
let D={tx:[],cfg:defCfg()};
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);D.tx=Array.isArray(o.tx)?o.tx:[];D.cfg=Object.assign(defCfg(),o.cfg||{});}}catch(e){}}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(D));return true;}catch(e){
  let n=0;D.tx.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).forEach(t=>{if(t.thumb&&n<60){delete t.thumb;n++;}});
  try{localStorage.setItem(KEY,JSON.stringify(D));toast('저장 공간이 부족해 오래된 영수증 썸네일을 정리했어요');return true;}
  catch(e2){toast('저장 실패: 저장 공간이 가득 찼어요. 백업 후 정리해 주세요');return false;}
 }
}
const allCats=()=>BASE.concat(D.cfg.customCats);
const catOf=id=>allCats().concat(INC).find(c=>c.id===id)||BASE[BASE.length-1];
const catByName=n=>allCats().concat(INC).find(c=>c.name===n);
const monthTx=ym=>D.tx.filter(t=>t.date&&t.date.startsWith(ym));
const sumOf=(arr,type)=>arr.filter(t=>t.type===type).reduce((a,t)=>a+(+t.amount||0),0);
function byCat(ym){const m={};monthTx(ym).filter(t=>t.type==='expense').forEach(t=>{m[t.cat]=(m[t.cat]||0)+t.amount;});return Object.keys(m).map(id=>({id:id,v:m[id]})).sort((a,b)=>b.v-a.v);}

/* ===== 상태 ===== */
const ui={tab:'home',ym:nowYm(),mode:'list',q:'',cat:'',pay:'',day:null,statCat:null,sheet:null,queue:null,locked:false,pinBuf:'',installEv:null};

/* ===== 토스트/로딩 ===== */
let tt;
function toast(m,ms){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),ms||2800);}
function showBusy(m){$('#busyt').textContent=m;$('#busy').classList.add('show');}
function setBusy(m){$('#busyt').textContent=m;}
function hideBusy(){$('#busy').classList.remove('show');}

/* ===== 화면 ===== */
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
function mnav(){return '<div class="mnav"><button data-act="mprev" aria-label="이전 달">‹</button><button class="mtitle" data-act="mnow">'+ymTitle(ui.ym)+'</button><button data-act="mnext" aria-label="다음 달">›</button></div>';}
function rowHTML(t){const c=catOf(t.cat);return '<button class="row" data-act="edit" data-id="'+t.id+'"><span class="ico" style="background:'+c.color+'22">'+c.emoji+'</span><span class="rt"><b>'+esc(t.merchant||'(사용처 없음)')+'</b><small>'+esc(c.name)+' · '+esc(t.payment||'')+(t.source==='receipt'?' · 📷':'')+(t.source==='sms'?' · 💬':'')+(t.source==='quick'?' · ⚡':'')+(t.source==='recurring'?' · 🔁':'')+'</small></span><span class="amt '+t.type+'">'+(t.type==='income'?'+':'-')+num(t.amount)+'</span></button>';}
const sortTx=a=>a.slice().sort((x,y)=>x.date<y.date?1:x.date>y.date?-1:(y.createdAt||0)-(x.createdAt||0));

function vHome(){
 const ym=ui.ym,tx=monthTx(ym),exp=sumOf(tx,'expense'),inc=sumOf(tx,'income');
 const prev=sumOf(monthTx(addMonth(ym,-1)),'expense');
 let diff='<span class="mut">전월 기록 없음</span>';
 if(prev>0){const p=Math.round((exp-prev)/prev*100);diff='<span class="'+(p>0?'up':'down')+'">전월 대비 '+(p>0?'▲':'▼')+' '+Math.abs(p)+'%</span>';}
 let h='';

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),4000);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('이미지를 열 수 없어요'));};im.src=u;});}
function drawScaled(im,max,q){const w=im.naturalWidth,h=im.naturalHeight,s=Math.min(1,max/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);}
async function prepImage(file){const im=await loadImg(file),full=drawScaled(im,2000,0.85),thumb=drawScaled(im,240,0.6);return{dataUrl:full,b64:full.split(',')[1],mime:'image/jpeg',thumb:thumb};}

async function fetchT(url,opt,ms){const ac=new AbortController(),id=setTimeout(()=>ac.abort(),ms||45000);try{return await fetch(url,Object.assign({},opt,{signal:ac.signal}));}catch(e){if(e.name==='AbortError')throw new Error('응답이 너무 오래 걸려요. 다시 시도해 주세요');throw new Error('인터넷 연결을 확인해 주세요');}finally{clearTimeout(id);}}
function apiErr(name,status,j){
 const msg=((j&&j.error&&(j.error.message||j.error))||'').toString().slice(0,120);
 let m=status===400?'요청 오류(키·모델 이름을 확인하세요)':status===401||status===403?'API 키가 올바르지 않거나 권한이 없어요':status===404?'모델 이름을 찾을 수 없어요(설정에서 모델 이름을 바꿔 보세요)':status===429?'무료 사용량 한도를 넘었어요. 잠시 후 다시 시도하세요':status>=500?name+' 서버가 일시적으로 불안정해요':'오류 '+status;
 return name+': '+m+(msg?' — '+msg:'');
}
async function callGemini(img,text){
 const key=(D.cfg.geminiKey||'').trim();if(!key)throw new Error('Gemini API 키가 없어요. 설정에서 입력해 주세요');
 const model=(D.cfg.geminiModel||'gemini-3.5-flash').trim();
 const parts=[{text:text||buildPrompt()}];if(img)parts.push({inline_data:{mime_type:img.mime,data:img.b64}});
 const body={contents:[{parts:parts}],generationConfig:{temperature:0}};if(img)body.generationConfig.responseMimeType='application/json';
 const r=await fetchT('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(apiErr('Gemini',r.status,j));
 const ps=(((j.candidates||[])[0]||{}).content||{}).parts||[],tx=ps.map(p=>p.text||'').join('');
 if(!tx)throw new Error('AI가 빈 응답을 보냈어요');return tx;
}
async function callClaude(img,text){
 const key=(D.cfg.claudeKey||'').trim();if(!key)throw new Error('Claude API 키가 없어요. 설정에서 입력해 주세요');
 const content=[];if(img)content.push({type:'image',source:{type:'base64',media_type:img.mime,data:img.b64}});content.push({type:'text',text:text||buildPrompt()});
 const r=await fetchT('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:(D.cfg.claudeModel||'claude-haiku-5-5').trim(),max_tokens:1000,messages:[{role:'user',content:content}]})});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(apiErr('Claude',r.status,j));
 const tx=(j.content||[]).map(c=>c.text||'').join('');if(!tx)throw new Error('AI가 빈 응답을 보냈어요');return tx;
}
function parseJSON(t){t=String(t).replace(/```json|```/gi,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<=a)throw new Error('AI 응답을 해석하지 못했어요');try{return JSON.parse(t.slice(a,b+1));}catch(e){throw new Error('AI 응답을 해석하지 못했어요');}}
function normPay(p){p=String(p||'');if(/현금/.test(p))return '현금';if(/이체|계좌/.test(p))return '계좌이체';if(/페이|pay|간편|토스|카카오|네이버/i.test(p))return '간편결제';return '카드';}
function normalizeAI(o){
 if(!o||typeof o!=='object')throw new Error('AI 응답을 해석하지 못했어요');
 const amount=Math.round(Number(String(o.amount==null?'':o.amount).replace(/[^\d.]/g,'')))||0;
 let date=String(o.date||'').replace(/[./]/g,'-');const m=date.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);date=m?m[1]+'-'+pad(m[2])+'-'+pad(m[3]):todayStr();
 const merchant=String(o.merchant||'').trim().slice(0,60),items=Array.isArray(o.items)?o.items.map(String).filter(Boolean):[];
 let c=catByName(String(o.category||'').trim());
 const isInc=o.type==='income';
 const catId=isInc?((c&&INC.includes(c))?c.id:'inc_etc'):(learnedCat(merchant)||((c&&!INC.includes(c))?c.id:guessCat(merchant+' '+items.join(' '))));
 const memo=items.length?items.slice(0,8).join(', ').slice(0,140):(o.memo?String(o.memo).slice(0,140):'');
 return {type:isInc?'income':'expense',date:date,dateFound:!!o.date,merchant:merchant,amount:amount,cat:catId,payment:normPay(o.payment),payFound:!!o.payment,memo:memo,conf:Number(o.confidence)||null};

function parseReceiptText(t){
 const lines=t.split(/\n/).map(s=>s.trim()).filter(Boolean);
 let date=todayStr();const dm=t.match(/(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);if(dm)date=dm[1]+'-'+pad(dm[2])+'-'+pad(dm[3]);
 const keys=/(합\s*계|총\s*액|결제\s*금액|받을\s*금액|청구\s*금액|승인\s*금액|TOTAL)/i;let amount=0;
 for(const l of lines){if(keys.test(l)){const ns=(l.replace(/\s/g,'').match(/\d[\d,]{2,}/g)||[]).map(n=>+n.replace(/,/g,'')).filter(n=>n<10000000);if(ns.length){amount=Math.max.apply(null,ns);break;}}}
 if(!amount){const ns=(t.match(/\d{1,3}(,\d{3})+/g)||[]).map(n=>+n.replace(/,/g,'')).filter(n=>n<10000000);if(ns.length)amount=Math.max.apply(null,ns);}

function detectRecurring(){
 const cutoff=addMonth(nowYm(),-6),groups={};
 D.tx.forEach(t=>{if(t.type!=='expense'||t.source==='recurring'||!t.merchant||!t.date||t.date.slice(0,7)<cutoff)return;const k=mKey(t.merchant);if(!k)return;(groups[k]=groups[k]||[]).push(t);});
 const known=D.cfg.recurring.map(r=>mKey(r.name)),ign=D.cfg.recIgnore||[],out=[];
 Object.keys(groups).forEach(k=>{
  if(known.indexOf(k)>=0||ign.indexOf(k)>=0)return;
  const byM={};groups[k].forEach(t=>{const m=t.date.slice(0,7);(byM[m]=byM[m]||[]).push(t);});
  const ms=Object.keys(byM).sort();if(ms.length<2)return;
  if(ms.some(m=>byM[m].length>1))return;
  const reps=ms.map(m=>byM[m][0]),amts=reps.map(t=>t.amount).sort((a,b)=>a-b),med=amts[Math.floor(amts.length/2)];
  const days=reps.map(t=>+t.date.slice(8)),dmin=Math.min.apply(null,days),dmax=Math.max.apply(null,days),dsort=days.slice().sort((a,b)=>a-b),dmed=dsort[Math.floor(dsort.length/2)];
  let ok=false;
  if(ms.length===2){ok=amts[0]===amts[1]&&addMonth(ms[0],1)===ms[1]&&dmax-dmin<=3;}
  else{ok=amts.every(a=>Math.abs(a-med)<=med*0.1)&&dmax-dmin<=6;}
  if(ok){const last=reps[reps.length-1];out.push({key:k,name:last.merchant,amount:med,day:dmed,cat:last.cat,n:ms.length,last:ms[ms.length-1]});}
 });
 return out.sort((a,b)=>b.n-a.n||b.amount-a.amount);
}

function parseCSV(text){
 text=text.replace(/^﻿/,'');const rows=[];let row=[],cur='',q=false;
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
  else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[];}
  else cur+=c;}
 if(cur!==''||row.length){row.push(cur);rows.push(row);}
 return rows.filter(r=>r.some(x=>x!==''));
}

  case 'mnow':ui.ym=nowYm();ui.day=null;renderMain();break;
  case 'gomonth':ui.ym=d.ym;ui.statCat=null;renderMain();break;
  case 'mode':ui.mode=d.v;renderMain();break;
  case 'cat':ui.cat=d.id;renderMain();break;
  case 'payf':ui.pay=d.id;renderMain();break;
  case 'day':ui.day=ui.day===d.d?null:d.d;updateList();break;
  case 'statcat':ui.statCat=ui.statCat===d.id?null:d.id;renderMain();break;
  case 'edit':{const t=D.tx.find(x=>x.id===d.id);if(t)openForm(Object.assign({},t),{edit:true});break;}
  case 'add':ui.sheet={type:'add'};renderSheet();break;
  case 'pick':if(d.v==='cam')$('#fcam').click();else if(d.v==='gal')$('#fgal').click();else if(d.v==='sms'){ui.sheet={type:'sms'};renderSheet();}else{closeSheet();openForm({date:todayStr()},{});}break;
  case 'nlgo':runNL();break;
  case 'smsgo':runSMS();break;
  case 'recadd':{const r=detectRecurring().find(x=>x.key===d.k);if(r){D.cfg.recurring.push({id:uid(),name:r.name,amount:r.amount,day:Math.min(31,r.day),cat:r.cat,last:r.last,start:nowYm()});applyRecurring();save();renderMain();toast('고정지출로 등록했어요 🔁 다음 달부터 자동 기록돼요');}break;}
  case 'recign':D.cfg.recIgnore=(D.cfg.recIgnore||[]).concat([d.k]);save();renderMain();break;
  case 'recreset':D.cfg.recIgnore=[];save();renderMain();break;
  case 'unlearn':delete D.cfg.learn[d.k];save();renderMain();break;
  case 'closesheet':if(ui.queue){ui.queue=null;}closeSheet();break;
  case 'zoom':el.classList.toggle('big');break;
  case 'ftype':syncForm();ui.sheet.t.type=d.v;ui.sheet.t.cat=d.v==='income'?'salary':'etc';renderSheet();break;
  case 'fcat':syncForm();ui.sheet.t.cat=d.id;$('#f_cats').innerHTML=catChips(ui.sheet.t);break;
  case 'fpay':syncForm();ui.sheet.t.payment=d.v;Array.prototype.forEach.call($('#f_pays').children,b=>b.classList.toggle('on',b.dataset.v===d.v));break;
  case 'fsave':saveForm();break;
  case 'fskip':closeSheet();if(ui.queue){ui.queue.i++;setTimeout(nextScan,200);}break;
  case 'fdel':if(confirm('이 내역을 삭제할까요?')){const id=ui.sheet.t.id;D.tx=D.tx.filter(x=>x.id!==id);save();closeSheet();renderMain();toast('삭제했어요');}break;
  case 'hideios':D.cfg.iosTipHidden=true;save();renderMain();break;
  /* 설정 */
  case 'prov':D.cfg.provider=d.v;save();renderMain();break;
  case 'testai':testAI();break;
  case 'addrec':{const n=($('#rc_name').value||'').trim(),a=Math.round(Number(($('#rc_amt').value||'').replace(/[^\d.]/g,''))),dy=parseInt($('#rc_day').value,10);if(!n||!(a>0)||!(dy>=1&&dy<=31)){toast('이름·금액·일(1~31)을 입력해 주세요');break;}D.cfg.recurring.push({id:uid(),name:n,amount:a,day:dy,cat:$('#rc_cat').value,last:null,start:nowYm()});applyRecurring();save();renderMain();toast('고정지출을 등록했어요 🔁');break;}
  case 'delrec':D.cfg.recurring=D.cfg.recurring.filter(r=>r.id!==d.id);save();renderMain();toast('고정지출을 삭제했어요(이미 기록된 내역은 유지)');break;
  case 'addcat':{const n=($('#nc_name').value||'').trim(),e=($('#nc_emoji').value||'').trim()||'🏷️';if(!n){toast('이름을 입력해 주세요');break;}if(allCats().concat(INC).some(c=>c.name===n)){toast('이미 있는 이름이에요');break;}D.cfg.customCats.push({id:'c_'+Date.now().toString(36),name:n,emoji:e,color:CUSTOM_COLORS[D.cfg.customCats.length%CUSTOM_COLORS.length]});save();renderMain();break;}
  case 'delcat':if(confirm('이 카테고리를 삭제할까요?\n해당 내역은 "기타"로 표시돼요.')){D.cfg.customCats=D.cfg.customCats.filter(c=>c.id!==d.id);save();renderMain();}break;
  case 'pinset':ui.sheet={type:'pin'};renderSheet();break;
  case 'pinsave':{const a=$('#pin1').value,b=$('#pin2').value;if(!/^\d{4}$/.test(a)){toast('숫자 4자리로 입력해 주세요');break;}if(a!==b){toast('두 번 입력한 값이 달라요');break;}hashPin(a).then(h=>{D.cfg.pinHash=h;save();closeSheet();renderMain();toast('PIN을 설정했어요 🔒');});break;}
  case 'pinoff':if(confirm('PIN 잠금을 해제할까요?')){D.cfg.pinHash='';save();renderMain();}break;
  case 'csvout':exportCSV();break;
  case 'csvin':$('#fcsv').click();break;
  case 'jsonout':exportJSON();break;
  case 'jsonin':$('#fjson').click();break;
  case 'sample':makeSample();break;
  case 'unsample':D.tx=D.tx.filter(t=>!t.sample);save();renderMain();toast('샘플 데이터를 지웠어요');break;
  case 'wipe':if(confirm('모든 내역을 삭제합니다. 되돌릴 수 없어요.\n계속할까요?')&&confirm('정말 삭제할까요? (백업을 먼저 권장해요)')){D.tx=[];save();renderMain();toast('모두 삭제했어요');}break;
  case 'install':if(ui.installEv){ui.installEv.prompt();ui.installEv=null;}break;
  case 'key':pressKey(d.v);break;
  case 'kdel':ui.pinBuf=ui.pinBuf.slice(0,-1);{const l=$('#lockwrap');if(l)l.innerHTML=lockHTML();}break;
  case 'forgot':if(confirm('PIN을 잊으셨나요?\n앱의 모든 데이터를 삭제하고 PIN을 해제할 수 있어요.\n(백업 파일이 있다면 이후 복원할 수 있어요)')){D.tx=[];D.cfg.pinHash='';save();hideLock();renderMain();toast('초기화했어요');}break;
 }
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el,e);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='nl_in'){e.preventDefault();runNL();}});
document.addEventListener('input',e=>{if(e.target.id==='q'){ui.q=e.target.value;updateList();}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.cfg){const k=t.dataset.cfg;D.cfg[k]=k==='budgetTotal'?(Math.round(Number(String(t.value).replace(/[^\d.]/g,'')))||0):t.value.trim?t.value.trim():t.value;save();if(k==='theme')applyTheme();if(k==='budgetTotal')toast('예산을 저장했어요');}
 else if(t.dataset&&t.dataset.bcat){const v=Math.round(Number(String(t.value).replace(/[^\d.]/g,'')))||0;if(v>0)D.cfg.budgetCat[t.dataset.bcat]=v;else delete D.cfg.budgetCat[t.dataset.bcat];save();}
 else if(t.id==='fcam'||t.id==='fgal'){const f=Array.prototype.slice.call(t.files);t.value='';startScan(f);}
 else if(t.id==='fcsv'){const f=t.files[0];t.value='';if(f)f.text().then(importCSV);}
 else if(t.id==='fjson'){const f=t.files[0];t.value='';if(f)f.text().then(importJSON);}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();ui.installEv=e;});
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();}else if(D.cfg.pinHash&&hiddenAt&&Date.now()-hiddenAt>60000&&!ui.locked){showLock();}});
if(window.matchMedia)try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}

/* ===== 시작 ===== */
load();applyRecurring();applyTheme();injectPWA();renderMain();showLock();takeIncoming();
window.__gagyebu={D:()=>D,ui:ui,normalizeAI:normalizeAI,parseReceiptText:parseReceiptText,parseCardSMS:parseCardSMS,splitSMS:splitSMS,parseNL:parseNL,detectRecurring:detectRecurring,mKey:mKey,koNum:koNum,catFor:catFor,findCancelMatch:findCancelMatch,isDup:isDup,hideLock:hideLock};
})();
</script>
</body>
</html>
